<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hedging Trading Platform</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #4CAF50;
        }
        .trade-button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .up {
            background-color: rgba(76, 175, 80, 0.7);
        }
        .down {
            background-color: rgba(244, 67, 54, 0.7);
        }
        .trade-button:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hedging Trading Platform</h1>
        <p>Simultaneous Up/Down Trades</p>
        <button class="trade-button up">Up Trade</button>
        <button class="trade-button down">Down Trade</button>
    </div>
</body>
</html>
